name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:ikio-version
      - run: npm test
      - run: npm run test:scripts
      - run: npm run format:check
      - run: npx --no-install prettier --check scripts/*.mjs scripts/tests/*.mjs
      - run: npm run build
      - run: npm run check:hacs
      - run: npm run package:ikio
      - uses: actions/upload-artifact@v4
        with:
          name: ikio-cards
          path: |
            release/ikio-v*.zip
            dist/ha-ikio-cards.js
            dist/licenses/
          if-no-files-found: error

  release:
    needs: [check, previews]
    environment:
      name: github-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ikio-release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ikio-cards
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: previews-${{ github.sha }}
          path: dist/previews
      - name: Determine release eligibility
        id: eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {version} = JSON.parse(fs.readFileSync('ikio/package.json'));
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            core.setOutput('publish', !releases.some(r => r.tag_name === `ikio-v${version}` && !r.draft));
      - name: Read retained preview site
        if: steps.eligibility.outputs.publish == 'true'
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add preview-site FETCH_HEAD
          else
            mkdir preview-site
            cd preview-site
            git init -b gh-pages
          fi
      - name: Prepare immutable version
        if: steps.eligibility.outputs.publish == 'true'
        run: node scripts/publish-previews.mjs dist/previews preview-site "$GITHUB_SHA" dist/ha-ikio-cards.js
      - name: Save retained site
        if: steps.eligibility.outputs.publish == 'true'
        run: |
          cd preview-site
          touch .nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if ! git diff --cached --quiet; then git commit -m "Publish versioned card previews"; fi
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
      - uses: actions/configure-pages@v5
        if: steps.eligibility.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.eligibility.outputs.publish == 'true'
        with:
          path: preview-site
      - uses: actions/deploy-pages@v4
        if: steps.eligibility.outputs.publish == 'true'
      - name: Verify hosted gallery
        if: steps.eligibility.outputs.publish == 'true'
        run: |
          node scripts/verify-hosted-previews.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`);
            const result = await publishRelease({ github, context });
            core.info(JSON.stringify(result));

  previews:
    needs: check
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run preview:check
      - run: npm run preview:build && npm run preview:generate
      - name: Compare target branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../preview-base "$BASE_SHA"
          (cd ../preview-base && npm ci && npm run build)
          PREVIEW_SOURCE=../preview-base PREVIEW_OUTPUT=dist/base-previews npm run preview:build
          PREVIEW_SOURCE=../preview-base PREVIEW_OUTPUT=dist/base-previews npm run preview:generate
          node scripts/compare-previews.mjs dist/base-previews dist/previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-${{ github.sha }}
          path: dist/previews
          retention-days: 30
          if-no-files-found: error
      - name: Preview report
        if: always()
        run: |
          echo "## Card previews" >> "$GITHUB_STEP_SUMMARY"
          echo "Download previews-${GITHUB_SHA} from this run for the HTML gallery, screenshots and PR comparison. Capture failures block publication; visual changes require review." >> "$GITHUB_STEP_SUMMARY"
