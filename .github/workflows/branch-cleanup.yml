name: Clean merged branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths: [.github/workflows/branch-cleanup.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            const pulls = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'closed', base: 'main', per_page: 100});
            const deleted = [];
            for (const branch of branches) {
              if (['main', 'gh-pages'].includes(branch.name) || branch.protected) continue;
              const merged = pulls.find(p => p.merged_at && p.head.repo?.full_name === `${owner}/${repo}` && p.head.ref === branch.name && p.head.sha === branch.commit.sha);
              if (!merged) continue;
              // Recheck immediately before deletion; retain branches changed after merging.
              const {data: current} = await github.rest.git.getRef({owner, repo, ref: `heads/${branch.name}`});
              if (current.object.sha !== merged.head.sha) continue;
              await github.rest.git.deleteRef({owner, repo, ref: `heads/${branch.name}`});
              deleted.push(`${branch.name} (PR #${merged.number})`);
            }
            await core.summary.addHeading('Merged branch cleanup').addList(deleted.length ? deleted : ['No unchanged merged branches to delete.']).write();
