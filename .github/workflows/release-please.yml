name: Prepare release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare Conventional Commit release PR
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (context.eventName === 'workflow_run' && main.commit.sha !== context.payload.workflow_run.head_sha) {
              core.info('A newer main commit exists; its CI will prepare the release.');
              return;
            }
            const {prepareReleasePullRequest} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-please.mjs`);
            const result = await prepareReleasePullRequest({github, context, token: process.env.GITHUB_TOKEN});
            core.info(JSON.stringify(result));
            if (!result.skipped) {
              core.setOutput('branch', result.branch);
              core.setOutput('number', result.number);
              core.setOutput('sha', result.sha);
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        if: steps.release.outputs.branch != ''
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - name: Refresh generated release files
        if: steps.release.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          npm ci
          npm run release:prepare
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md ha-ikio-cards.js licenses/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): refresh generated files"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
      - name: Run CI explicitly for the bot PR
        if: steps.release.outputs.branch != ''
        uses: actions/github-script@v7
        with:
          script: |
            // GITHUB_TOKEN pushes do not trigger push/pull_request CI.
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci.yml',
              ref: '${{ steps.release.outputs.branch }}',
              inputs: {release_pr: '${{ steps.release.outputs.number }}'}
            });
            await core.summary.addHeading('Release prepared').addLink('Review release PR', `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${{ steps.release.outputs.number }}`).write();
