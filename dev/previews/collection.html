<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Ikio collection fixtures</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0d171b;
      color: #e5e9e7;
      font: 14px system-ui;
    }
    h1 {
      font-size: 22px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button,
    select {
      min-height: 44px;
      font: inherit;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 16px;
      align-items: start;
    }
    section {
      min-width: 0;
    }
    .caption {
      font-size: 12px;
      color: #a4adb2;
      margin: 8px;
    }
    pre {
      white-space: pre-wrap;
    }
    ha-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
    }
    ha-icon:before {
      content: "●";
      color: currentColor;
    }
  </style>
  <h1>Ikio · interactive fixture gallery</h1>
  <p>
    Simulated entities only. No Home Assistant connection. Icon dots stand in
    for HA icons.
  </p>
  <div class="toolbar">
    <button data-theme="dark">Dark</button
    ><button data-theme="light">Light</button
    ><label
      >Card width
      <select id="width">
        <option value="auto">Auto grid</option>
        <option>280</option>
        <option>360</option>
        <option>390</option>
        <option>520</option>
      </select></label
    ><button id="offline">Toggle offline fixtures</button>
  </div>
  <main></main>
  <pre id="log" role="status"></pre>
  <script type="module">
    // Use the same bundled fixture as release screenshots and browser checks.
    await import("../../dist/ha-ikio-cards.js");
    await import("../../dist/previews/fixtures.js");
  </script>
</html>
